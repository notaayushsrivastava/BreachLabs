{% set on_home = request.path == '/' %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ meta.title }}</title>
<meta name="description" content="{{ meta.description }}">
<link rel="canonical" href="{{ meta.canonical_path }}">
<meta property="og:title" content="{{ meta.title }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ meta.og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/images/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="/static/images/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://d8j0ntlcm91z4.cloudfront.net">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body{% if on_home %} data-hero="true"{% endif %}>
<a class="skip-link" href="#main">Skip to content</a>
<div class="progress-rail" aria-hidden="true"><i id="scroll-progress"></i></div>
{% include "components/nav.html" %}
<main id="main">{% block content %}{% endblock %}</main>
{% include "components/footer.html" %}
<div class="grain" aria-hidden="true"></div>
<script type="module" src="/static/js/main.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
