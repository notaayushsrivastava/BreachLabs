<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ meta.title }}</title>
<meta name="description" content="{{ meta.description }}">
<link rel="canonical" href="{{ meta.canonical_path }}">
<meta property="og:title" content="{{ meta.title }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ meta.og_image }}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/static/images/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink: "#000000", mut: "#8e8e8e", pill: "#28282a", ok: "#8bd3a7", warn: "#d6b66c", bad: "#e28d8d" },
  fontFamily: { sans: ["Inter","Segoe UI","system-ui","sans-serif"], display: ["BubbledotICG-FinePos","Geist Pixel Circle","monospace"] }
}}};
</script>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="scroll-progress" aria-hidden="true"></div>
{% include "components/nav.html" %}
<main id="main">{% block content %}{% endblock %}</main>
{% include "components/footer.html" %}
<script type="module" src="/static/js/main.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
